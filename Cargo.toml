[workspace]
resolver = "3"
members = ["crates/core", "crates/modules", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["waybar-rs contributors"]

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
serde_json = "1"
json5 = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-channel = "2"
chrono = { version = "0.4", features = ["clock"] }
