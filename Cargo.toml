[workspace]
resolver = "3"
members = ["crates/core", "crates/modules", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["waybar-rs contributors"]

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
serde_json = "1"
json5 = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-channel = "2"
chrono = { version = "0.4", features = ["clock", "unstable-locales"] }
chrono-tz = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "time",
    "signal",
    "sync",
    "macros",
    "io-util",
] }
futures-lite = "2"
swayipc-async = "3.0"
evdev = "0.13"
regex = "1"
zbus = "5"
nmrs = "3.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
pipewire = "0.10"
system-tray = "0.8"
udev = "0.9"
libc = "0.2"

# Vendored to silence the expected shutdown-race noise in system-tray's tray
# client (see vendor/system-tray/PATCHES.md). Keep the version pinned so the
# patch target stays unambiguous.
[patch.crates-io]
system-tray = { path = "vendor/system-tray" }
